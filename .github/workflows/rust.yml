name: Rust

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release -p docxthedocs --locked
