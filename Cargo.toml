[workspace]
resolver = "2"
members = [
    "crates/docxthedocs-cfb",
    "crates/docxthedocs-doc",
    "crates/docxthedocs-ir",
    "crates/docxthedocs-ooxml",
    "crates/docxthedocs-validate",
    "crates/docxthedocs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Nehemiaga/DocxTheDocs"

[workspace.dependencies]
cfb = "0.14.0"
clap = { version = "4.6.5", features = ["derive"] }
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
